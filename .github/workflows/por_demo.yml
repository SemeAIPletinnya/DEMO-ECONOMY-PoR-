name: PoR Demo Run

on:
  push:
  workflow_dispatch:

jobs:
  run-por:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r requirements.txt || true

      - name: Run demo
        run: python por_demo.py

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: por-results
          path: |
            demo_results.json
            demo_table.md